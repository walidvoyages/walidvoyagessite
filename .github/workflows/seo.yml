
name: Publish SEO and articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SEO static HTML
        run: python generate-seo.py

      - name: Commit generated pages
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add index.html sitemap.xml articles/

          if ! git diff --cached --quiet; then
            git commit -m "Update SEO pages from Firebase"
            git push
          fi
